name: Tengu AI — Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Tengu AI sources
        uses: actions/checkout@v4
      - name: Assemble Tengu AI 8.3 source tree
        run: |
          set -euo pipefail
          unzip -t Tengu_AI_8_1_Alpha2_Android_Source.zip >/dev/null
          unzip -q Tengu_AI_8_1_Alpha2_Android_Source.zip
          base64 -d Tengu_AI_8_2_Alpha1_patch.base64.txt > /tmp/tengu82.zip
          unzip -t /tmp/tengu82.zip >/dev/null
          unzip -q -o /tmp/tengu82.zip
          base64 -d Tengu_AI_8_3_Bundled_Hotfix.b64.txt > /tmp/tengu83.zip
          unzip -t /tmp/tengu83.zip >/dev/null
          unzip -q -o /tmp/tengu83.zip
          test -s Tengu_Android/app/src/main/res/raw/tengu_theme.ogg
          test -f Tengu_Android/app/src/main/AndroidManifest.xml
          cd Tengu_Android
          node tests/runtime.test.cjs
          node tests/math.test.cjs
          node tests/patch82.test.cjs
          node tests/evolution_bundle.test.cjs
          node tests/evolution_access.test.cjs
          node tests/branding_bundle.test.cjs
          rm -f gradle/wrapper/gradle-wrapper.jar
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android platform and native toolchain
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare launcher icon
        working-directory: Tengu_Android
        run: |
          python3 -m pip install --user Pillow
          python3 tools/install_avatar.py
      - name: Fetch pinned llama.cpp source
        working-directory: Tengu_Android
        run: bash tools/get_llama_cpp.sh
      - name: Include verified on-device language model in the APK
        working-directory: Tengu_Android
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/models
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 --max-time 1200 \
            'https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf' \
            -o app/src/main/assets/models/tengu-model.gguf
          test "$(stat -c '%s' app/src/main/assets/models/tengu-model.gguf)" = 491400032
          echo '74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db  app/src/main/assets/models/tengu-model.gguf' | sha256sum --check
          cp TENGU_MODEL_NOTICE.txt app/src/main/assets/TENGU_MODEL_NOTICE.txt
      - name: Compile Tengu AI Android APK
        working-directory: Tengu_Android
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle')
          s=p.read_text()
          old='buildTypes { release { minifyEnabled false } }'
          assert old in s
          s=s.replace(old,"""buildTypes {
              debug { applicationIdSuffix '.bundled' }
              release { minifyEnabled false }
          }""")
          assert "versionName '8.3-alpha1'" in s
          p.write_text(s)
          m=Path('app/src/main/AndroidManifest.xml').read_text()
          assert 'android:label="Tengu AI"' in m, 'App must be branded Tengu AI'
          PY
          gradle --no-daemon :app:assembleDebug
      - name: Verify final APK
        run: |
          set -euo pipefail
          test -s Tengu_Android/app/build/outputs/apk/debug/app-debug.apk
          cp Tengu_Android/app/build/outputs/apk/debug/app-debug.apk Tengu_AI_8.3_alpha1.apk
          test "$(stat -c '%s' Tengu_AI_8.3_alpha1.apk)" -gt 490000000
          echo "APK bytes: $(stat -c '%s' Tengu_AI_8.3_alpha1.apk)"
      - name: Upload Tengu AI test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tengu-AI-8.3-APK
          path: Tengu_AI_8.3_alpha1.apk
          if-no-files-found: error
          compression-level: 0
      - name: Publish Tengu AI 8.3 APK in GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v8.3-alpha1 >/dev/null 2>&1; then
            gh release upload v8.3-alpha1 Tengu_AI_8.3_alpha1.apk --clobber
          else
            gh release create v8.3-alpha1 Tengu_AI_8.3_alpha1.apk \
              --title 'Tengu AI 8.3 Alpha 1' --prerelease --latest=false \
              --notes 'Tengu AI includes the 491 MB Apache-2.0 Qwen2.5 0.5B GGUF inside one APK. First launch prepares the model locally. Tengu-3 is unlocked; Tengu-4 key gates experimental UI only, not a new model. Tengu Agent and strong Tengu-4 are still in development. Keep the previous app installed until Android tests pass.'
          fi
