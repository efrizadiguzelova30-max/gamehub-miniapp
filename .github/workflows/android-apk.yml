name: Tengu AI — Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Tengu sources
        uses: actions/checkout@v4
      - name: Unpack complete Android project
        run: |
          unzip -t Tengu_AI_8_1_Alpha2_Android_Source.zip
          unzip -q Tengu_AI_8_1_Alpha2_Android_Source.zip
          unzip -t Tengu_AI_8_2_Alpha1_patch.zip
          unzip -q -o Tengu_AI_8_2_Alpha1_patch.zip
          test -f Tengu_Android/app/src/main/res/raw/tengu_theme.ogg
          (cd Tengu_Android && node tests/runtime.test.cjs && node tests/math.test.cjs && node tests/patch82.test.cjs)
          test -f Tengu_Android/app/src/main/AndroidManifest.xml
          # The bundled wrapper JAR is custom; Gradle is installed by setup-gradle below.
          # Remove only the wrapper JAR from the ephemeral runner before validation.
          rm -f Tengu_Android/gradle/wrapper/gradle-wrapper.jar
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Accept licenses and install build tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Japanese launcher icon
        working-directory: Tengu_Android
        run: |
          python3 -m pip install --user Pillow
          python3 tools/install_avatar.py
      - name: Fetch llama.cpp source
        working-directory: Tengu_Android
        run: bash tools/get_llama_cpp.sh
      - name: Compile side-by-side Tengu 8.2 APK
        working-directory: Tengu_Android
        run: |
          # Each GitHub runner has its own debug signing key. Separate package ID
          # protects the user's installed 8.1 app and chat history from uninstall.
          sed -i "s/buildTypes { release { minifyEnabled false } }/buildTypes { debug { applicationIdSuffix '.alpha' } release { minifyEnabled false } }/" app/build.gradle
          sed -i 's/android:label="Tengu AI"/android:label="Tengu 8.2 Test"/' app/src/main/AndroidManifest.xml
          grep -F "applicationIdSuffix '.alpha'" app/build.gradle
          gradle --no-daemon :app:assembleDebug
      - name: Prepare APK
        run: |
          test -s Tengu_Android/app/build/outputs/apk/debug/app-debug.apk
          cp Tengu_Android/app/build/outputs/apk/debug/app-debug.apk Tengu_AI_8.2_alpha1.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tengu-8.2-alpha1-APK
          path: Tengu_AI_8.2_alpha1.apk
          if-no-files-found: error
      - name: Publish direct APK in GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v8.2-alpha1 >/dev/null 2>&1; then
            gh release upload v8.2-alpha1 Tengu_AI_8.2_alpha1.apk --clobber
          else
            gh release create v8.2-alpha1 Tengu_AI_8.2_alpha1.apk --title 'Tengu AI 8.2 Alpha 1' --notes 'Experimental Tengu Android alpha with model download, improved knowledge API, opt-in AI image requests, and original background music. User-device end-to-end verification is still required.' --prerelease --latest=false
          fi
