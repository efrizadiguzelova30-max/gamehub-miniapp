name: Tengu AI 8.4 — Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Tengu AI sources
        uses: actions/checkout@v4
      - name: Assemble Tengu AI 8.4 source tree
        run: |
          set -euo pipefail
          unzip -t Tengu_AI_8_1_Alpha2_Android_Source.zip >/dev/null
          unzip -q Tengu_AI_8_1_Alpha2_Android_Source.zip
          base64 -d Tengu_AI_8_2_Alpha1_patch.base64.txt > /tmp/tengu82.zip
          unzip -t /tmp/tengu82.zip >/dev/null
          unzip -q -o /tmp/tengu82.zip
          base64 -d Tengu_AI_8_3_patch.base64.txt > /tmp/tengu83.zip
          unzip -t /tmp/tengu83.zip >/dev/null
          unzip -q -o /tmp/tengu83.zip
          base64 -d Tengu_AI_8_4_update.base64.txt > /tmp/tengu84.zip
          unzip -t /tmp/tengu84.zip >/dev/null
          unzip -q -o /tmp/tengu84.zip
          test -s Tengu_Android/app/src/main/res/raw/tengu_theme.ogg
          test -f Tengu_Android/app/src/main/AndroidManifest.xml
          cd Tengu_Android
          node tests/runtime.test.cjs
          node tests/math.test.cjs
          node tests/patch82.test.cjs
          node tests/evolution_bundle.test.cjs
          node tests/evolution_access.test.cjs
          node tests/branding_bundle.test.cjs
          node tests/upgrade84.test.cjs
          rm -f gradle/wrapper/gradle-wrapper.jar
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android platform and native toolchain
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare launcher icon
        working-directory: Tengu_Android
        run: |
          python3 -m pip install --user Pillow
          python3 tools/install_avatar.py
      - name: Fetch pinned llama.cpp source
        working-directory: Tengu_Android
        run: bash tools/get_llama_cpp.sh
      - name: Download and SHA256-verify bundled Qwen3-1.7B GGUF
        working-directory: Tengu_Android
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/models
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 30 --max-time 3000 \
            'https://huggingface.co/bartowski/Qwen_Qwen3-1.7B-GGUF/resolve/main/Qwen_Qwen3-1.7B-IQ3_XXS.gguf' \
            -o app/src/main/assets/models/tengu-model.gguf
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('app/src/main/assets/models/tengu-model.gguf')
          size=p.stat().st_size
          expected='5c7649660c508f31f522ac7fa9e70fa03f989250ce9884cc3747f0e6c7443fbe'
          actual=hashlib.sha256(p.read_bytes()).hexdigest()
          assert actual==expected, 'Model SHA256 does not match the published Hugging Face digest'
          assert 800_000_000 < size < 970_000_000, 'Model outside APK size limit'
          url='https://huggingface.co/bartowski/Qwen_Qwen3-1.7B-GGUF/resolve/main/Qwen_Qwen3-1.7B-IQ3_XXS.gguf'
          j=Path('app/src/main/java/app/tengu/assistant/TenguBundledModel.java')
          j.write_text('package app.tengu.assistant;\n'
                       'final class TenguBundledModel {\n'
                       '    static final long SIZE = '+str(size)+'L;\n'
                       '    static final String SHA256 = "'+expected+'";\n'
                       '    static final String URL = "'+url+'";\n'
                       '    private TenguBundledModel() {}\n'
                       '}\n',encoding='utf-8')
          print('Tengu AI Qwen3 model verified SHA256, bytes:',size)
          PY
          curl --fail --location --retry 3 --connect-timeout 30 \
            'https://huggingface.co/Qwen/Qwen3-1.7B/resolve/main/LICENSE' \
            -o app/src/main/assets/TENGU_MODEL_LICENSE.txt
          printf '%s\n' 'Tengu AI bundles third-party pretrained Qwen3-1.7B IQ3_XXS under Apache-2.0, quantized by bartowski. SHA256 verified by release process. Offline text stays on-device.' > app/src/main/assets/TENGU_MODEL_NOTICE.txt
      - name: Compile Tengu AI Android APK
        working-directory: Tengu_Android
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle')
          s=p.read_text()
          old='buildTypes { release { minifyEnabled false } }'
          assert old in s
          s=s.replace(old,"""buildTypes {
              debug { applicationIdSuffix '.smart84' }
              release { minifyEnabled false }
          }""")
          assert "versionName '8.4-alpha1'" in s
          p.write_text(s)
          m=Path('app/src/main/AndroidManifest.xml').read_text()
          assert 'android:label="Tengu AI"' in m, 'App must be branded Tengu AI'
          PY
          gradle --no-daemon :app:assembleDebug
      - name: Verify final APK
        run: |
          set -euo pipefail
          test -s Tengu_Android/app/build/outputs/apk/debug/app-debug.apk
          cp Tengu_Android/app/build/outputs/apk/debug/app-debug.apk Tengu_AI_8.4_alpha1.apk
          size=$(stat -c '%s' Tengu_AI_8.4_alpha1.apk)
          test "$size" -gt 700000000
          test "$size" -lt 1000000000
          echo "APK bytes: $(stat -c '%s' Tengu_AI_8.4_alpha1.apk)"
      - name: Upload Tengu AI test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tengu-AI-8.4-APK
          path: Tengu_AI_8.4_alpha1.apk
          if-no-files-found: error
          compression-level: 0
      - name: Publish Tengu AI 8.3 APK in GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v8.4-alpha1 >/dev/null 2>&1; then
            gh release upload v8.4-alpha1 Tengu_AI_8.4_alpha1.apk --clobber
          else
            gh release create v8.4-alpha1 Tengu_AI_8.4_alpha1.apk \
              --title 'Tengu AI 8.4 Alpha 1' --prerelease --latest=false \
              --notes 'Experimental Tengu AI Android APK with Qwen3-1.7B IQ3_XXS offline model bundled and SHA verified. One anime background for all models. Tengu-4 answers using same base model with extended prompting; exact access key unchanged. Early local Tengu Agent generates code and exports it but does not execute it. Heavy quantization may reduce accuracy and speed; untested on real Android. Other internet image/search features remain third-party opt-in. Separate test app ID to protect existing installation.'
          fi
