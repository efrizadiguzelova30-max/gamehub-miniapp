name: Tengu AI 8.5 — Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Tengu AI sources
        uses: actions/checkout@v4
      - name: Assemble Tengu AI 8.5 source tree
        run: |
          set -euo pipefail
          unzip -t Tengu_AI_8_1_Alpha2_Android_Source.zip >/dev/null
          unzip -q Tengu_AI_8_1_Alpha2_Android_Source.zip
          base64 -d Tengu_AI_8_2_Alpha1_patch.base64.txt > /tmp/tengu82.zip
          unzip -t /tmp/tengu82.zip >/dev/null
          unzip -q -o /tmp/tengu82.zip
          base64 -d Tengu_AI_8_3_patch.base64.txt > /tmp/tengu83.zip
          unzip -t /tmp/tengu83.zip >/dev/null
          unzip -q -o /tmp/tengu83.zip
          base64 -d Tengu_AI_8_4_update.base64.txt > /tmp/tengu84.zip
          unzip -t /tmp/tengu84.zip >/dev/null
          unzip -q -o /tmp/tengu84.zip
          base64 -d Tengu_AI_8_5_patch.base64.txt > /tmp/tengu85.zip
          unzip -t /tmp/tengu85.zip >/dev/null
          unzip -q -o /tmp/tengu85.zip
          test -s Tengu_Android/app/src/main/res/raw/tengu_theme.ogg
          test -f Tengu_Android/app/src/main/AndroidManifest.xml
          cd Tengu_Android
          node tests/runtime.test.cjs
          node tests/math.test.cjs
          node tests/patch82.test.cjs
          node tests/evolution_bundle.test.cjs
          node tests/evolution_access.test.cjs
          node tests/branding_bundle.test.cjs
          node tests/upgrade84.test.cjs
          node tests/upgrade85.test.cjs
          rm -f gradle/wrapper/gradle-wrapper.jar
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android platform and native toolchain
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare launcher icon
        working-directory: Tengu_Android
        run: |
          python3 -m pip install --user Pillow
          python3 tools/install_avatar.py
      - name: Fetch pinned llama.cpp source
        working-directory: Tengu_Android
        run: bash tools/get_llama_cpp.sh
      - name: Download and SHA256-verify Tengu AI text and photo models
        working-directory: Tengu_Android
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/models
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 30 --max-time 3600 \
            'https://huggingface.co/bartowski/Qwen_Qwen3-4B-Instruct-2507-GGUF/resolve/main/Qwen_Qwen3-4B-Instruct-2507-IQ3_M.gguf' \
            -o app/src/main/assets/models/tengu-model.gguf
          echo 'b458203e8ad6d3f9b82c1190cbd77e8502f4f763985cefdbe85ed18947fcac9d  app/src/main/assets/models/tengu-model.gguf' | sha256sum -c -
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 30 --max-time 900 \
            'https://huggingface.co/qualcomm/Real-ESRGAN-x4plus/resolve/e802f7d60f80be9abb948cbd987571eaf8d0fe1c/Real-ESRGAN-x4plus_float.tflite' \
            -o app/src/main/assets/models/tengu-superres.tflite
          echo '439ffbfd12638800f0f1e11054d3a4adc38bec757933bac89bb5f0648bb52dd1  app/src/main/assets/models/tengu-superres.tflite' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/models/tengu-model.gguf')
          s=p.stat().st_size
          assert 1_800_000_000 < s < 2_100_000_000, 'Unexpected GGUF size'
          t=Path('app/src/main/assets/models/tengu-superres.tflite')
          assert 60_000_000 < t.stat().st_size < 80_000_000, 'Unexpected photo model size'
          java=Path('app/src/main/java/app/tengu/assistant/TenguBundledModel.java')
          java.write_text('package app.tengu.assistant;\n'
              'final class TenguBundledModel {\n'
              '    static final long SIZE = '+str(s)+'L;\n'
              '    static final String SHA256 = "b458203e8ad6d3f9b82c1190cbd77e8502f4f763985cefdbe85ed18947fcac9d";\n'
              '    static final String URL = "https://huggingface.co/bartowski/Qwen_Qwen3-4B-Instruct-2507-GGUF/resolve/main/Qwen_Qwen3-4B-Instruct-2507-IQ3_M.gguf";\n'
              '    private TenguBundledModel() {}\n'
              '}\n',encoding='utf-8')
          print('Verified both models, sizes:',s,t.stat().st_size)
          PY
          curl -fLsS --retry 3 'https://huggingface.co/Qwen/Qwen3-4B-Instruct-2507/resolve/main/LICENSE' -o app/src/main/assets/TENGU_MODEL_LICENSE.txt
          curl -fLsS --retry 3 'https://huggingface.co/qualcomm/Real-ESRGAN-x4plus/resolve/e802f7d60f80be9abb948cbd987571eaf8d0fe1c/LICENSE' -o app/src/main/assets/TENGU_PHOTO_MODEL_LICENSE.txt
          printf '%s\n' 'Tengu AI ships third-party Qwen3-4B-Instruct-2507 (IQ3_M GGUF) and Real-ESRGAN-x4plus TFLite. Both models are SHA256-verified. Local inference and enhancement stay on device unless an optional third-party online feature is used.' > app/src/main/assets/TENGU_MODEL_NOTICE.txt
      - name: Validate TFLite photo model interface
        working-directory: Tengu_Android
        run: |
          python3 -m pip install --user 'tflite>=2.10,<3' flatbuffers
          python3 - <<'PY'
          from pathlib import Path
          import tflite
          p=Path('app/src/main/assets/models/tengu-superres.tflite')
          m=tflite.Model.GetRootAsModel(p.read_bytes(),0)
          g=m.Subgraphs(0)
          shapes=[]
          for tid in [g.Inputs(0),g.Outputs(0)]:
              tensor=g.Tensors(tid)
              shape=[tensor.Shape(i) for i in range(tensor.ShapeLength())]
              shapes.append((shape,tensor.Type()))
          print('Super-resolution input/output tensors:',shapes,flush=True)
          expected=[([1,128,128,3],0),([1,512,512,3],0)]
          if shapes != expected:
              raise RuntimeError('Android photo renderer expects NHWC float32; model differs: '+str(shapes))
          PY
      - name: Compile Tengu AI Android APK
        working-directory: Tengu_Android
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle')
          s=p.read_text()
          old='buildTypes { release { minifyEnabled false } }'
          assert old in s
          s=s.replace(old,"""buildTypes {
              debug { applicationIdSuffix '.smart85' }
              release { minifyEnabled false }
          }""")
          assert "versionName '8.5-alpha1'" in s
          p.write_text(s)
          m=Path('app/src/main/AndroidManifest.xml').read_text()
          assert 'android:label="Tengu AI"' in m, 'App must be branded Tengu AI'
          PY
          gradle --no-daemon :app:assembleDebug
      - name: Verify final APK
        run: |
          set -euo pipefail
          test -s Tengu_Android/app/build/outputs/apk/debug/app-debug.apk
          cp Tengu_Android/app/build/outputs/apk/debug/app-debug.apk Tengu_AI_8.5_alpha1.apk
          size=$(stat -c '%s' Tengu_AI_8.5_alpha1.apk)
          test "$size" -gt 1800000000
          test "$size" -lt 2147483648
          echo "APK bytes: $(stat -c '%s' Tengu_AI_8.5_alpha1.apk)"
      - name: Upload Tengu AI test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tengu-AI-8.5-APK
          path: Tengu_AI_8.5_alpha1.apk
          if-no-files-found: error
          compression-level: 0
      - name: Publish Tengu AI 8.5 APK in GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v8.5-alpha1 >/dev/null 2>&1; then
            gh release upload v8.5-alpha1 Tengu_AI_8.5_alpha1.apk --clobber
          else
            gh release create v8.5-alpha1 Tengu_AI_8.5_alpha1.apk \
              --title 'Tengu AI 8.5 Alpha 1' --prerelease --latest=false \
              --notes 'Experimental Tengu AI 8.5 Android: bundled Qwen3-4B-Instruct-2507 IQ3_M, local Real-ESRGAN photo super-resolution, Tengu Agent private workspace and restricted JavaScript tests. Model checksums verified in CI. Not yet proven on an Android device. On-device privacy for offline tools; online image generation/search remain optional external services. Separate test app to protect current chats.'
          fi
